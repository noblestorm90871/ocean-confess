<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#03151f"
    >

    <title>A Little Ocean</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Serif+Display&family=Manrope:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>

<div id="ocean">


    <!-- =====================================================
         BACKGROUND
    ====================================================== -->

    <div
        id="stars"
        class="stars"
    ></div>


    <div
        id="backgroundBubbles"
        class="background-bubbles"
    ></div>


    <!-- =====================================================
         STEP 1
    ====================================================== -->

    <section
        id="step1"
        class="scene step1-scene"
    >

        <div class="moon"></div>


        <div class="top-brand">

            <span class="brand-symbol">
                ◒
            </span>

            <div>

                <strong>
                    for you
                </strong>

                <small>
                    a little ocean
                </small>

            </div>

        </div>


        <div class="step1-content">

            <span
                id="step1Eyebrow"
                class="eyebrow"
            ></span>


            <h1
                id="step1Title"
            ></h1>


            <p
                id="step1Description"
            ></p>


            <button
                id="diveButton"
                class="water-button"
                type="button"
            >

                <span class="water-wave"></span>

                <span class="water-wave wave-two"></span>

                <span
                    id="step1Button"
                    class="button-text"
                ></span>

                <span
                    id="step1Arrow"
                    class="button-arrow"
                ></span>

            </button>


            <small
                id="step1Note"
                class="hint"
            ></small>

        </div>


        <div class="shell">

            <div class="shell-line line-1"></div>
            <div class="shell-line line-2"></div>
            <div class="shell-line line-3"></div>
            <div class="shell-line line-4"></div>

            <div class="pearl"></div>

        </div>


        <div class="surface">

            <div class="surface-wave sw1"></div>
            <div class="surface-wave sw2"></div>
            <div class="surface-wave sw3"></div>

        </div>

    </section>


    <!-- =====================================================
         STEP 2
    ====================================================== -->

    <section
        id="step2"
        class="scene step2-scene underwater"
    >

        <div class="underwater-depth"></div>


        <div class="underwater-rays">

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>


        <div class="caustics">

            <i></i>
            <i></i>
            <i></i>
            <i></i>
            <i></i>
            <i></i>

        </div>


        <div
            id="underwaterBubbles"
            class="underwater-bubbles"
        ></div>


        <div
            id="fishSchool"
            class="fish-school"
        ></div>


        <div class="sea-plants">

            <span class="plant plant-1"></span>
            <span class="plant plant-2"></span>
            <span class="plant plant-3"></span>
            <span class="plant plant-4"></span>
            <span class="plant plant-5"></span>
            <span class="plant plant-6"></span>

        </div>


        <div class="coral-reef">

            <div class="coral coral-pink">

                <i></i>
                <i></i>
                <i></i>
                <i></i>
                <i></i>

            </div>


            <div class="coral coral-blue">

                <i></i>
                <i></i>
                <i></i>

            </div>


            <div class="coral coral-soft">

                <i></i>
                <i></i>
                <i></i>
                <i></i>

            </div>


            <div class="reef-rock rock-1"></div>
            <div class="reef-rock rock-2"></div>
            <div class="reef-rock rock-3"></div>

            <div class="small-coral coral-left"></div>
            <div class="small-coral coral-right"></div>

        </div>


        <div class="underwater-glow"></div>


        <div class="step2-content">

            <span
                id="step2Eyebrow"
                class="eyebrow"
            ></span>


            <h2
                id="step2Title"
            ></h2>


            <p
                id="step2Description"
            ></p>


            <div class="floating-shell">

                <div class="shell-line"></div>
                <div class="shell-line"></div>
                <div class="shell-line"></div>

                <div class="pearl"></div>

            </div>


            <button
                id="page2Button"
                class="water-button"
                type="button"
            >

                <span class="water-wave"></span>

                <span class="water-wave wave-two"></span>

                <span
                    id="step2Button"
                    class="button-text"
                ></span>

                <span
                    id="step2Arrow"
                    class="button-arrow"
                ></span>

            </button>

        </div>


        <div class="sea-floor"></div>

    </section>


    <!-- =====================================================
         STEP 3
    ====================================================== -->

    <section
        id="page3"
        class="story-page"
    >

        <div class="page-aura"></div>

        <div class="page-moon"></div>


        <div class="page-content">

            <div
                id="step3Eyebrow"
                class="page-label"
            ></div>


            <h2 id="step3Title"></h2>


            <p id="step3Description"></p>


            <div class="tide-field">

                <button
                    type="button"
                    class="tide-object shell-object"
                    data-object="shell"
                >

                    <span class="object-shadow"></span>

                    <span class="object-shell">

                        <i></i>
                        <i></i>
                        <i></i>
                        <i></i>

                        <b></b>

                    </span>

                </button>


                <button
                    type="button"
                    class="tide-object star-object"
                    data-object="star"
                >

                    <span class="object-shadow"></span>

                    <span class="object-star">

                        <i></i>
                        <i></i>
                        <i></i>
                        <i></i>
                        <i></i>

                    </span>

                </button>


                <button
                    type="button"
                    class="tide-object bottle-object"
                    data-object="bottle"
                >

                    <span class="object-shadow"></span>

                    <span class="object-bottle">

                        <span class="bottle-neck"></span>

                        <span class="bottle-body">

                            <span class="tiny-paper">
                                ♡
                            </span>

                        </span>

                    </span>

                </button>

            </div>


            <div
                id="tideMessage"
                class="tide-message"
            >

                <button
                    id="closeTideMessage"
                    class="close-message"
                    type="button"
                >
                    ×
                </button>


                <span
                    id="tideMessageText"
                ></span>

            </div>


            <div
                id="step3Hint"
                class="touch-hint"
            ></div>


            <button
                id="page3Button"
                class="liquid-button"
                type="button"
            >

                <span class="liquid-fill"></span>

                <span
                    id="step3Button"
                    class="liquid-label"
                ></span>

                <b
                    id="step3Arrow"
                ></b>

            </button>

        </div>

    </section>


    <!-- =====================================================
         STEP 4
    ====================================================== -->

    <section
        id="page4"
        class="story-page"
    >

        <div class="page-aura"></div>

        <div class="page-moon"></div>


        <div class="page-content">

            <div
                id="step4Eyebrow"
                class="page-label"
            ></div>


            <h2 id="step4Title"></h2>


            <p id="step4Description"></p>


            <div class="shell-choices">

                <button
                    type="button"
                    class="choice-shell"
                    data-choice="moon"
                >

                    <span class="choice-icon">
                        ☾
                    </span>


                    <span class="choice-shell-shape">

                        <i></i>
                        <i></i>
                        <i></i>

                        <b></b>

                    </span>


                    <small
                        id="moonLabel"
                    ></small>

                </button>


                <button
                    type="button"
                    class="choice-shell"
                    data-choice="pearl"
                >

                    <span class="choice-icon">
                        ✦
                    </span>


                    <span class="choice-shell-shape">

                        <i></i>
                        <i></i>
                        <i></i>

                        <b></b>

                    </span>


                    <small
                        id="pearlLabel"
                    ></small>

                </button>


                <button
                    type="button"
                    class="choice-shell"
                    data-choice="tide"
                >

                    <span class="choice-icon">
                        ≋
                    </span>


                    <span class="choice-shell-shape">

                        <i></i>
                        <i></i>
                        <i></i>

                        <b></b>

                    </span>


                    <small
                        id="tideLabel"
                    ></small>

                </button>

            </div>


            <div
                id="answerReveal"
                class="answer-reveal"
            ></div>


            <button
                id="page4Continue"
                class="liquid-button hidden-next"
                type="button"
            >

                <span class="liquid-fill"></span>

                <span
                    id="step4Button"
                    class="liquid-label"
                ></span>

                <b
                    id="step4Arrow"
                ></b>

            </button>

        </div>

    </section>


    <!-- =====================================================
         STEP 5
    ====================================================== -->

    <section
        id="page5"
        class="story-page"
    >

        <div class="page-aura"></div>

        <div class="page-moon"></div>


        <div class="page-content">

            <div
                id="step5Eyebrow"
                class="page-label"
            ></div>


            <div
                id="step5Script"
                class="page-script"
            ></div>


            <h2 id="step5Title"></h2>


            <div class="floating-letter-area">

                <div class="letter-water"></div>


                <button
                    id="bottleLetter"
                    class="bottle-letter"
                    type="button"
                >

                    <span
                        class="letter-bottle-neck"
                    ></span>


                    <span
                        class="letter-bottle-body"
                    >

                        <span class="letter-paper">
                            ♡
                        </span>

                    </span>

                </button>

            </div>


            <div
                id="page5Reveal"
                class="page5-reveal"
            >

                <p
                    id="step5Reveal1"
                ></p>


                <p
                    id="step5Reveal2"
                    class="small-line"
                ></p>

            </div>


            <button
                id="page5Continue"
                class="liquid-button hidden-next"
                type="button"
            >

                <span class="liquid-fill"></span>

                <span
                    id="step5Button"
                    class="liquid-label"
                ></span>

                <b
                    id="step5Arrow"
                ></b>

            </button>

        </div>

    </section>


    <!-- =====================================================
         STEP 6
    ====================================================== -->

    <section
        id="page6"
        class="story-page"
    >

        <div class="page-aura"></div>

        <div class="page-moon"></div>


        <div class="page-content">

            <div
                id="step6Eyebrow"
                class="page-label"
            ></div>


            <div class="question-shell">
                ♡
            </div>


            <div
                id="step6Script"
                class="page-script"
            ></div>


            <h2 id="step6Title"></h2>


            <p
                id="step6Description"
            ></p>


            <div
                id="questionActions"
                class="question-actions"
            >

                <button
                    type="button"
                    class="question-button"
                    data-answer="maybe"
                >

                    <span class="button-water"></span>

                    <span class="question-icon">
                        <span id="maybeIcon"></span>
                    </span>

                    <span id="maybeLabel"></span>

                    <span class="selection-glow"></span>

                </button>


                <button
                    type="button"
                    class="question-button"
                    data-answer="yes"
                >

                    <span class="button-water"></span>

                    <span class="question-icon">
                        <span id="yesIcon"></span>
                    </span>

                    <span id="yesLabel"></span>

                    <span class="selection-glow"></span>

                </button>


                <button
                    type="button"
                    class="question-button"
                    data-answer="notyet"
                >

                    <span class="button-water"></span>

                    <span class="question-icon">
                        <span id="notyetIcon"></span>
                    </span>

                    <span id="notyetLabel"></span>

                    <span class="selection-glow"></span>

                </button>

            </div>


            <div
                id="questionReply"
                class="question-reply"
            ></div>


            <div
                id="step6Hint"
                class="question-hint"
            ></div>

        </div>

    </section>


    <!-- =====================================================
         STEP 7
    ====================================================== -->

    <section
        id="page7"
        class="story-page"
    >

        <div class="page-aura"></div>

        <div class="page-moon"></div>


        <div class="page-content">

            <div
                id="step7Eyebrow"
                class="page-label"
            ></div>


            <div
                id="step7Script"
                class="page-script"
            ></div>


            <h2 id="step7Title"></h2>


            <p
                id="step7Description"
                class="page-subtitle"
            ></p>


            <button
                id="tideHeart"
                class="tide-heart"
                type="button"
            >

                <span class="heart-water"></span>

                <span class="heart-shape">
                    ♡
                </span>

                <span class="heart-shine">
                    ✦
                </span>

            </button>


            <div
                id="heartRipple"
                class="heart-ripple"
            ></div>


            <div
                id="page7Reveal"
                class="page7-reveal"
            >

                <p id="step7Reveal1"></p>

                <p
                    id="step7Reveal2"
                    class="small-line"
                ></p>

            </div>


            <button
                id="page7Continue"
                class="liquid-button hidden-next"
                type="button"
            >

                <span class="liquid-fill"></span>

                <span
                    id="step7Button"
                    class="liquid-label"
                ></span>

                <b
                    id="step7Arrow"
                ></b>

            </button>

        </div>

    </section>


    <!-- =====================================================
         STEP 8
    ====================================================== -->

    <section
        id="page8"
        class="story-page"
    >

        <div class="page-aura"></div>

        <div class="page-moon"></div>


        <div class="page-content">

            <div
                id="step8Normal"
                class="step8-normal"
            >

                <div
                    id="step8Eyebrow"
                    class="page-label"
                ></div>


                <div
                    id="step8Script"
                    class="page-script"
                ></div>


                <h2 id="step8Title"></h2>


                <p
                    id="step8Description"
                    class="page-subtitle"
                ></p>


                <div
                    id="finalChoices"
                    class="final-choices"
                >

                    <button
                        id="finalYes"
                        class="final-button"
                        type="button"
                    >

                        <span class="final-water"></span>

                        <span class="final-icon">
                            ♡
                        </span>

                        <span
                            id="finalYesText"
                            class="final-label"
                        ></span>

                        <small
                            id="finalYesSubtext"
                        ></small>

                    </button>


                    <button
                        id="finalNotYet"
                        class="final-button"
                        type="button"
                    >

                        <span class="final-water"></span>

                        <span class="final-icon">
                            ◌
                        </span>

                        <span
                            id="finalNotYetText"
                            class="final-label"
                        ></span>

                        <small
                            id="finalNotYetSubtext"
                        ></small>

                    </button>

                </div>

            </div>


            <div
                id="finalReveal"
                class="final-reveal"
            >

                <div
                    id="finalEyebrow"
                    class="final-eyebrow"
                ></div>


                <h3
                    id="finalTitle"
                ></h3>


                <p
                    id="finalMessage"
                ></p>


                <div
                    id="finalClosing"
                    class="final-closing"
                ></div>


                <div class="final-signature">

                    <span>—</span>

                    <strong
                        id="finalBen"
                    ></strong>

                    <span>•</span>

                    <strong
                        id="finalOmni"
                    ></strong>

                    <span>—</span>

                </div>

            </div>

        </div>

    </section>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="site-credit">

        <span
            id="footerPrefix"
        ></span>

        <strong
            id="footerBen"
        ></strong>

        <span
            id="footerSeparator"
        >•</span>

        <strong
            id="footerOmni"
        ></strong>

    </footer>


    <!-- =====================================================
         MUSIC PLAYER
    ====================================================== -->

    <div
        id="musicPlayer"
        class="floating-player"
    >

        <div class="player-top">

            <div class="mini-album">
                ◒
            </div>


            <div class="mini-track">

                <strong
                    id="musicTitle"
                ></strong>

                <small
                    id="musicArtist"
                ></small>

            </div>


            <button
                id="miniPlay"
                class="mini-play-button"
                type="button"
            >
                ▶
            </button>

        </div>


        <div class="mini-progress">

            <span id="currentTime">
                0:00
            </span>


            <input
                id="seekBar"
                type="range"
                min="0"
                max="100"
                step="0.1"
                value="0"
            >


            <span id="duration">
                0:00
            </span>

        </div>


        <div class="mini-controls">

            <button
                id="restartBtn"
                type="button"
            >
                |◀
            </button>


            <button
                id="muteBtn"
                type="button"
            >
                ♪
            </button>


            <input
                id="volumeBar"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="0.35"
            >

        </div>

    </div>


    <!-- =====================================================
         AUDIO
    ====================================================== -->

    <audio
        id="bgmAudio"
        src="./assets/audio/bgm.mp3"
        preload="metadata"
        loop
    ></audio>


    <audio
        id="clickAudio"
        src="./assets/audio/click.mp3"
        preload="auto"
    ></audio>


    <audio
        id="transitionAudio"
        src="./assets/audio/transition.mp3"
        preload="auto"
    ></audio>


    <audio
        id="heartbeatAudio"
        src="./assets/audio/heartbeat.mp3"
        preload="auto"
    ></audio>


    <audio
        id="successAudio"
        src="./assets/audio/success.mp3"
        preload="auto"
    ></audio>


</div>


<script src="./content.js"></script>

<script src="./script.js"></script>

</body>
</html>
